apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-api
  namespace: llm
  labels:
    app: llm-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-api
  minReplicas: 1
  maxReplicas: 3                # llm-api is stateless thin proxy, can scale horizontally freely
  metrics:
    # ============ Primary metric: CPU utilization ============
    # 60%: reserve 40% for burst traffic, scale up before hitting limit
    # CPU is real bottleneck for llm-api (JSON serialization + httpx forwarding)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # ============ Secondary metric: memory utilization ============
    # 75%: as secondary protection for memory leak / large request accumulation
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # ============ Scale-up policy ============
    # stabilizationWindow: average over 15 seconds, avoid instantaneous spike scaling
    # 100% / 60s: at most double per minute (1→2→3), fast response
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    # ============ Scale-down policy ============
    # stabilizationWindow: average over 5 minutes before scaling down, avoid flapping
    # 50% / 120s: at most halve every 2 minutes, gentle
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Max
