apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-worker
  namespace: llm
  labels:
    app: vllm-worker
  annotations:
    argocd-image-updater.argoproj.io/image-list: vllm-worker=ghcr.io/johnny-dai-git/llm-deployment/vllm-worker
    argocd-image-updater.argoproj.io/vllm-worker.update-strategy: name
    argocd-image-updater.argoproj.io/vllm-worker.allow-tags: regexp:^v-[0-9]{8}-[0-9]{6}$
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-credentials
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  # 初始 1 副本,实际由 HPA(vllm-hpa.yaml)按队列深度动态调整 1↔2
  # HPA 一旦运行后会接管这个字段,不要手动改 replicas
  # 上限 2 来自 GPU time-slicing 切 2 份;Lambda 多 GPU 时改 HPA maxReplicas
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-worker

  template:
    metadata:
      labels:
        app: vllm-worker
      # Prometheus 抓取由 vllm-servicemonitor.yaml(ServiceMonitor)负责,
      # 不再使用 prometheus.io/* annotation(kube-prometheus-stack 不读这个)

    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      nodeSelector:
        gpu-node: "true"

      containers:
      - name: vllm
        image: ghcr.io/johnny-dai-git/llm-deployment/vllm-worker:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8002
          protocol: TCP

        resources:
          # GCP A100 + MIG 1g.5gb sizing:
          # - Each MIG 1g.5gb instance gives 5 GB VRAM and 1/7 of A100 SMs.
          # - Qwen2.5-0.5B fp16 weights ~1 GB; the rest of VRAM is KV cache.
          # - Host RAM is plentiful on a2-highgpu-1g (85 GB total);
          #   keeping the same 4Gi/8Gi values as the laptop branch keeps
          #   per-pod RAM small so HPA can pack 7 replicas on a single
          #   GPU node without RAM contention.
          requests:
            nvidia.com/gpu: 1
            cpu: "1"
            memory: "4Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "8Gi"

        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server

        args:
          # ========= Model =========
          # Same model as the laptop branch (Qwen2.5-0.5B fp16) so the
          # before/after comparison is purely about hardware:
          # software time-slicing on RTX 4050 → hardware MIG on A100.
          - --model=/model/qwen2.5-0.5b
          - --served-model-name=qwen2.5-0.5b

          # ========= Server =========
          - --host=0.0.0.0
          - --port=8002

          # ========= Inference settings =========
          - --dtype=float16
          # 0.85 of a 5 GB MIG slice = ~4.25 GB usable
          # (1 GB weights + 3 GB KV cache + headroom)
          - --gpu-memory-utilization=0.85
          - --max-model-len=2048
          - --max-num-seqs=8
          - --max-num-batched-tokens=2048

          # On A100 we let vLLM use its preferred backends — FlashAttention 2,
          # CUDA Graph, cascade attention are all stable on data-center cards.
          # The laptop branch had to defensively disable these to survive a
          # consumer RTX 4050; not needed here.

        volumeMounts:
        - name: model-volume
          mountPath: /model

        # ========= Probes =========
        # vLLM 的 OpenAI server 暴露两个我们关心的端点:
        #   /health      —— 进程级活性 (HTTP 200 = uvicorn 在跑)
        #   /v1/models   —— 模型加载就绪后才返回 200
        #
        # 设计原则:
        #   - startup/readiness 都用 /v1/models -> 等模型真就绪才放流量
        #   - liveness 用 /health -> 进程活着即可,避免因为单次推理卡顿
        #     就把整个 GPU Pod 杀掉重启(代价大)
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8002
          initialDelaySeconds: 30        # 给模型加载留出冷启动时间
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30           # 30 * 10s = 5 分钟加载预算
                                         # qwen2.5-0.5b 几秒搞定;
                                         # 7B+ 模型可调高到 60+

        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          # readiness 失败 -> Pod 暂时从 Endpoints 摘掉,不接流量

        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 30              # 不频繁,GPU Pod 重启代价大
          timeoutSeconds: 5
          failureThreshold: 3
          # liveness 失败 -> Pod 重启(慎用,会触发模型重新加载)

      volumes:
      # GCP path: model weights live in a GCS bucket and are mounted
      # via GCS Fuse CSI driver, so all GPU pods (across nodes) read
      # from the same backing store without per-node downloads.
      # See: https://cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/cloud-storage-fuse-csi-driver
      #
      # The sidecar that mounts the bucket is configured via
      # spec.template.metadata.annotations:
      #   gke-gcsfuse/volumes: "true"
      # and uses Workload Identity to authenticate (no SA keys).
      #
      # For now we keep the simple hostPath for local A100 testing;
      # swap this block for the GCS Fuse PVC when running on GKE.
      - name: model-volume
        hostPath:
          path: /mnt/models
          type: DirectoryOrCreate
