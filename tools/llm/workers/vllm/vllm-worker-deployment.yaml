apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-worker
  namespace: llm
  labels:
    app: vllm-worker
  annotations:
    argocd-image-updater.argoproj.io/image-list: vllm-worker=ghcr.io/johnny-dai-git/llm-deployment/vllm-worker
    argocd-image-updater.argoproj.io/vllm-worker.update-strategy: name
    argocd-image-updater.argoproj.io/vllm-worker.allow-tags: regexp:^v-[0-9]{8}-[0-9]{6}$
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-credentials
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  # 初始 1 副本,实际由 HPA(vllm-hpa.yaml)按队列深度动态调整 1↔2
  # HPA 一旦运行后会接管这个字段,不要手动改 replicas
  # 上限 2 来自 GPU time-slicing 切 2 份;Lambda 多 GPU 时改 HPA maxReplicas
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-worker

  template:
    metadata:
      labels:
        app: vllm-worker
      # Prometheus 抓取由 vllm-servicemonitor.yaml(ServiceMonitor)负责,
      # 不再使用 prometheus.io/* annotation(kube-prometheus-stack 不读这个)

    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      nodeSelector:
        gpu-node: "true"

      containers:
      - name: vllm
        image: ghcr.io/johnny-dai-git/llm-deployment/vllm-worker:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8002
          protocol: TCP

        resources:
          # 资源调优记录:
          # - qwen2.5-0.5b 实测 host RAM 用量约 3 GB(Python + vLLM + 模型 buffer)
          # - GPU time-slicing 把 1 张物理卡切成 2 份,HPA 上限 2 副本
          # - 笔记本节点 30 GB 总 RAM,2 × 4Gi requests = 8Gi,留足 buffer
          # - 上 Lambda(独占 GPU + 大模型)时调回 16Gi 或更高
          requests:
            nvidia.com/gpu: 1
            cpu: "1"
            memory: "4Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "8Gi"

        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server

        args:
          # ========= 模型(AWQ 量化版) =========
          # Qwen2.5-1.5B-Instruct-AWQ 比原来的 0.5B fp16 大 3 倍,但
          # AWQ 4-bit 量化后显存占用差不多(~1.2 GB 权重 vs 原 1 GB).
          # 简历上能讲"在同样硬件跑更大模型"的故事.
          # 需要先下载模型,见 script/laptop/download-model.sh:
          #   MODEL_NAME=Qwen/Qwen2.5-1.5B-Instruct-AWQ \
          #   MODEL_LOCAL_NAME=qwen2.5-1.5b-awq \
          #   bash script/laptop/download-model.sh
          - --model=/model/qwen2.5-1.5b-awq
          - --served-model-name=qwen2.5-1.5b
          - --quantization=awq

          # ========= 服务监听 =========
          - --host=0.0.0.0
          - --port=8002

          # ========= 类型 / 上下文 =========
          - --dtype=float16
          # 0.5(原 0.4):AWQ 模型 + draft model + fp8 KV cache 一起需要
          # 多一点空间.time-slicing 上 2 个 pod 一起 = 100% 用满,边缘但 OK.
          # 如果 OOM 把 HPA maxReplicas 暂时调到 1 单独跑.
          - --gpu-memory-utilization=0.5
          - --max-model-len=2048
          - --max-num-seqs=8
          - --max-num-batched-tokens=2048

          # ========= KV cache 量化:fp8 e4m3 =========
          # 把 KV cache 从 fp16 压到 fp8,显存占用减半,可以跑更长 context
          # 或更大 batch.RTX 4050 (Ada, compute 8.9) 原生支持 fp8 e4m3.
          # 简历亮点:KV cache quantization
          - --kv-cache-dtype=fp8

          # ========= Speculative Decoding =========
          # 用原来的 0.5B 模型当 draft, 1.5B AWQ 当 target.
          # 流程:draft 一次生成 N 个 token -> target 并行验证 -> 接受/回滚
          # 对单流(并发低) latency 和 throughput 都有 1.5-2x 提升.
          # 简历亮点:speculative decoding with draft+target model setup
          # 注意:vLLM 0.11 spec dec 与 prefix caching/chunked prefill
          # 部分场景不兼容,如果启动报错把这一行注释掉.
          - --speculative-config={"model":"/model/qwen2.5-0.5b","num_speculative_tokens":5}

          # ========= 稳定性参数(消费级 GPU) =========
          # 关掉 CUDA graph + cascade attention,牺牲点性能换稳定
          - --disable-cascade-attn
          - --enforce-eager

        volumeMounts:
        - name: model-volume
          mountPath: /model

        # ========= Probes =========
        # vLLM 的 OpenAI server 暴露两个我们关心的端点:
        #   /health      —— 进程级活性 (HTTP 200 = uvicorn 在跑)
        #   /v1/models   —— 模型加载就绪后才返回 200
        #
        # 设计原则:
        #   - startup/readiness 都用 /v1/models -> 等模型真就绪才放流量
        #   - liveness 用 /health -> 进程活着即可,避免因为单次推理卡顿
        #     就把整个 GPU Pod 杀掉重启(代价大)
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8002
          initialDelaySeconds: 30        # 给模型加载留出冷启动时间
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30           # 30 * 10s = 5 分钟加载预算
                                         # qwen2.5-0.5b 几秒搞定;
                                         # 7B+ 模型可调高到 60+

        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          # readiness 失败 -> Pod 暂时从 Endpoints 摘掉,不接流量

        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 30              # 不频繁,GPU Pod 重启代价大
          timeoutSeconds: 5
          failureThreshold: 3
          # liveness 失败 -> Pod 重启(慎用,会触发模型重新加载)

      volumes:
      - name: model-volume
        hostPath:
          # 本地开发环境路径(Johnny 笔记本)
          # 容器内挂载到 /model,vLLM 启动参数 --model=/model/qwen2.5-0.5b
          # 所以这个目录下要有 qwen2.5-0.5b/ 子目录(放模型权重文件)
          # 上 Lambda 时改成 /home/ubuntu/k8s/model
          path: /home/johnny/Desktop/projects/llm-server/models
          type: DirectoryOrCreate
