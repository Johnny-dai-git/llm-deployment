apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-worker
  namespace: llm
  labels:
    app: vllm-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-worker
  minReplicas: 1
  # Lambda Labs A100 + MIG 1g.5gb × 7: each MIG instance is hardware-isolated,
  # one vllm pod per MIG. 7 replicas on a single A100 = highest
  # availability + isolation on a single physical GPU. Adding a second
  # A100 node bumps this to 14, etc.
  maxReplicas: 7
  metrics:
    # ============ Primary metric: vLLM internal queue depth ============
    # Exposed by prometheus-adapter (see tools/helm/monitoring/prometheus-adapter-values.yaml)
    # Average waiting requests per Pod > 5 → scale up
    #
    # Why use this not CPU: GPU inference service bottleneck is GPU,
    # CPU utilization is usually low, cannot reflect real pressure
    - type: Pods
      pods:
        metric:
          name: vllm_num_requests_waiting
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    # ============ Scale-up policy ============
    # GPU model loading is slow (cold start 30-60 seconds), cannot be too aggressive:
    # stabilizationWindow: 60 second average, avoid instantaneous peaks
    # At most scale up 1 Pod per 2 minutes, give new Pod time to load model
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Max
    # ============ Scale-down policy ============
    # GPU Pod restart cost is high (model reloading), cannot be too aggressive:
    # stabilizationWindow: average over 10 minutes before scaling down
    # At most scale down 1 Pod every 5 minutes, gentle
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
      selectPolicy: Max
